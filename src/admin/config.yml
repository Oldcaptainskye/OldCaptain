          - { label: "Web address", name: "permalink", widget: "hidden" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Social image", name: "ogImage", widget: "hidden", required: false }
          - { label: "Page content", name: "body", widget: "markdown" }
      - name: "privacy"
